<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Sliders 🎉</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    color: white;
  }

  h1 {
    font-size: 2.8rem;
    margin-bottom: 30px;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
  }

  .slider-container {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 480px;
    perspective: 1200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .carousel {
    position: relative;
    width: 280px;
    height: 380px;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .card {
    position: absolute;
    width: 200px;
    height: 300px;
    left: 40px;
    top: 40px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    border: 3px solid rgba(255,255,255,0.15);
    background: #111;
    transition: all 0.4s ease;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
  }

  /* Center text */
  .center-text {
    position: absolute;
    text-align: center;
    z-index: 10;
    pointer-events: none;
    text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
  }

  .center-text h2 {
    font-size: 2.4rem;
    font-weight: 700;
    color: #ff69b4;
    margin-bottom: 5px;
  }

  .center-text p {
    font-size: 1.6rem;
    color: #fff;
    letter-spacing: 3px;
  }

  .heart {
    font-size: 1.8rem;
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }

  /* Controls */
  .controls {
    margin-top: 40px;
    display: flex;
    gap: 20px;
  }

  button {
    background: linear-gradient(135deg, #ff69b4, #ff1493);
    border: none;
    color: white;
    padding: 12px 28px;
    font-size: 1.1rem;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
  }

  button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(255, 20, 147, 0.6);
  }

  /* Confetti */
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #ff69b4;
    top: -20px;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(100vh) rotate(720deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

  <h1>Birthday Sliders 🎉</h1>

  <div class="slider-container">
    <div class="carousel" id="carousel">
      <!-- Cards will be generated by JS -->
    </div>

    <div class="center-text">
      <h2>Happy <span class="heart">❤️</span></h2>
      <p>Birthday</p>
      <p style="font-size:1.4rem; margin-top:8px; color:#ffb6c1;">MARK</p>
    </div>
  </div>

  <div class="controls">
    <button onclick="prev()">← Prev</button>
    <button onclick="next()">Next →</button>
    <button onclick="autoPlay()">Auto Play</button>
  </div>

<script>
  // =============== IMAGE LINKS (replace with your own) ===============
    const images = [
    "assets/img 1.jpeg",
    "assets/img 2.jpeg",
    "assets/img 3.jpeg",
    "assets/img 4.jpeg",
    "assets/img 5.jpeg",
    "assets/img 6.jpeg",
    "assets/img 7.jpeg",
    "assets/img 8.jpeg",
    "assets/img 9.jpeg",
    "assets/img 10.jpeg"
];
   // replace these with real Hinata images 
    
  

  // Better free placeholder anime-style images (you can change)
  const realImages = [
    "assets/img 1.jpeg",
    "assets/img 2.jpeg",
    "assets/img 3.jpeg",
    "assets/img 5.jpeg",
    "assets/img 6.jpeg",
    "assets/img 7.jpeg",
    "assets/img 9.jpeg",
    "assets/img 4.jpeg"
  ];

  const carousel = document.getElementById('carousel');
  const total = realImages.length;
  const angle = 360 / total;
  let current = 0;
  let auto = null;

  // Create cards
  realImages.forEach((src, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.transform = `rotateY(${i * angle}deg) translateZ(320px)`;
    card.innerHTML = `<img src="${src}" alt="Hinata ${i+1}">`;
    carousel.appendChild(card);
  });

  function update() {
    carousel.style.transform = `rotateY(${-current * angle}deg)`;
  }

  function next() {
    current = (current + 1) % total;
    update();
    createConfetti();
  }

  function prev() {
    current = (current - 1 + total) % total;
    update();
    createConfetti();
  }

  function autoPlay() {
    if (auto) {
      clearInterval(auto);
      auto = null;
      return;
    }
    auto = setInterval(next, 2500);
  }

  // Confetti effect
  function createConfetti() {
    for (let i = 0; i < 18; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random() * 100 + 'vw';
      conf.style.background = `hsl(${Math.random()*60 + 300}, 100%, 70%)`;
      conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
      document.body.appendChild(conf);
      setTimeout(() => conf.remove(), 4000);
    }
  }

  // Start with some confetti
  setTimeout(createConfetti, 500);

  // Keyboard support
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });
</script>
</body>
</html>
